<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>X STORE | Official Experience</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&display=swap');

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: #000;
            font-family: 'Orbitron', sans-serif;
            display: flex; flex-direction: column;
            align-items: center; justify-content: space-between;
        }

        /* خلفية النجوم المتحركة */
        #starfield {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1;
        }

        /* الحاوية الرئيسية */
        .content-wrapper {
            position: relative; z-index: 10;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            height: 100vh; width: 100%;
            padding: 40px 0;
        }

        /* تصميم اللوجو العلوي (كما في الصورة) */
        .logo-section {
            flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
        }

        .brand-logo {
            width: 150px; height: 150px; cursor: grab;
            perspective: 1000px; touch-action: none;
            filter: drop-shadow(0 0 15px rgba(255, 255, 255, 0.8));
        }

        #logo-mesh {
            width: 100%; height: 100%; transform-style: preserve-3d; transition: transform 0.1s linear;
        }

        .store-name {
            color: #fff; font-size: 1.8rem; font-weight: 900; letter-spacing: 8px;
            margin-top: 10px; text-transform: uppercase;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.6), 0 0 20px rgba(255, 215, 0, 0.3);
        }

        /* القائمة المركزية (مطابقة للصورة) */
        .main-menu {
            flex: 1; display: flex; flex-direction: column; 
            align-items: center; justify-content: center; gap: 40px;
        }

        .menu-item {
            color: #fff; font-size: 1.5rem; font-weight: 400; letter-spacing: 10px;
            text-decoration: none; opacity: 0.7; transition: 0.4s all ease;
            cursor: pointer; position: relative;
        }

        .menu-item:hover {
            opacity: 1; transform: scale(1.1);
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.8), 0 0 30px rgba(255, 215, 0, 0.5);
        }

        /* شريط السوشيال ميديا السفلي */
        .footer-section {
            flex: 1; display: flex; align-items: flex-end; justify-content: center;
            padding-bottom: 50px; gap: 40px;
        }

        .social-link svg {
            width: 24px; height: 24px; fill: #fff; opacity: 0.6; transition: 0.3s;
        }

        .social-link:hover svg {
            opacity: 1; transform: translateY(-5px);
            filter: drop-shadow(0 0 10px #FFD700);
        }

        /* تأثير الخط الذهبي تحت العنصر عند التمرير */
        .menu-item::after {
            content: ''; position: absolute; bottom: -10px; left: 50%; width: 0; height: 2px;
            background: linear-gradient(90deg, transparent, #FFD700, transparent);
            transition: 0.4s; transform: translateX(-50%);
        }
        .menu-item:hover::after { width: 100%; }

    </style>
</head>
<body>

                        <path d="M70,170 Q100,160 130,170" stroke="#FFD700" stroke-width="4" fill="none" />
                    </svg>
                </div>
            </div>
            <div class="store-name">X STORE</div>
        </div>

        <nav class="main-menu">
            <a href="#" class="menu-item">HOME</a>

            <a href="#" class="menu-item">CONTACT</a>

        <div class="footer-section">

        </div>
    </div>

    <script>
        // برمجة النجوم (سرعة الفيديو المطلوبة)
        const canvas = document.getElementById('starfield');
        const ctx = canvas.getContext('2d');
        let stars = [];
        const starCount = 600; 
        const speed = 3.5; 

        function init() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            stars = [];
            for(let i=0; i<starCount; i++) {
                stars.push({
                    x: Math.random() * canvas.width - canvas.width/2,
                    y: Math.random() * canvas.height - canvas.height/2,
                    z: Math.random() * canvas.width,
                    o: Math.random()
                });
            }
        }

        function draw() {
            ctx.fillStyle = "black";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            for(let i=0; i<starCount; i++) {
                let s = stars[i];
                s.z -= speed; 
                if (s.z <= 0) s.z = canvas.width;
                let x = (s.x / s.z) * canvas.width + canvas.width/2;
                let y = (s.y / s.z) * canvas.height + canvas.height/2;
                let radius = (1 - s.z/canvas.width) * 2.5;
                ctx.beginPath();
                ctx.fillStyle = `rgba(255, 255, 255, ${s.o})`;
                ctx.arc(x, y, radius, 0, Math.PI*2);
                ctx.fill();
            }
            requestAnimationFrame(draw);
        }

        window.addEventListener('resize', init);
        init(); draw();

        // حركة تدوير اللوجو الاحترافية
        const container = document.getElementById('logoContainer');
        const mesh = document.getElementById('logo-mesh');
        let isDown = false; let startX, startY;

        const start = (e) => { 
            isDown = true; 
            startX = (e.pageX || e.touches[0].pageX); 
            startY = (e.pageY || e.touches[0].pageY); 
            mesh.style.transition = "none"; 
        };
        const move = (e) => { 
            if(!isDown) return; 
            let x = (e.pageX || e.touches[0].pageX); 
            let y = (e.pageY || e.touches[0].pageY);
            let rotY = (x - startX) * 0.5; 
            let rotX = (startY - y) * 0.5;
            mesh.style.transform = `rotateX(${rotX}deg) rotateY(${rotY}deg)`; 
        };
        const end = () => { 
            isDown = false; 
            mesh.style.transition = "transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275)"; 
            mesh.style.transform = `rotateX(0deg) rotateY(0deg)`; 
        };

        container.addEventListener('mousedown', start); window.addEventListener('mousemove', move); window.addEventListener('mouseup', end);
        container.addEventListener('touchstart', start); window.addEventListener('touchmove', move); window.addEventListener('touchend', end);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>X store- Smooth Space</title>
    
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* حاوية النجوم */
        #starfield {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* واجهة الموقع */
        .overlay {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            width: 100%;
        }

        /* اللوجو */
        .X store {
            width: 220px;
            height: 220px;
            cursor: grab;
            perspective: 1000px;
            touch-action: none;
            margin-bottom: 10px;
        }

        #logo-mesh {
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            transition: transform 0.1s linear;
            filter: drop-shadow(0 0 15px rgba(255, 255, 255, 0.9));
        }

        /* القائمة */
        .main-menu {
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .item {
            color: #ffffff;
            font-size: 1.6rem;
            font-weight: 900;
            letter-spacing: 6px;
            text-decoration: none;
            cursor: pointer;
            transition: 0.3s;
            opacity: 0.8;
            user-select: none;
        }

        .item:hover {
            opacity: 1;
            text-shadow: 0 0 20px #ffffff;
            transform: scale(1.05);
        }

        .item:active {
            color: #00ff00; 
            text-shadow: 0 0 30px #00ff00;
        }

        /* شريط السوشيال ميديا */
        .social-bar {
            position: absolute;
            bottom: 40px;
            z-index: 20;
            display: flex;
            gap: 30px;
        }

        .social-link {
            text-decoration: none;
        }

        .social-link svg {
            width: 28px;
            height: 28px;
            fill: white;
            opacity: 0.6;
            transition: 0.3s;
        }

        .social-link:hover svg {
            opacity: 1;
            transform: translateY(-5px);
            filter: drop-shadow(0 0 8px white);
        }
    </style>
</head>
<body>

    <canvas id="starfield"></canvas>

    <div class="overlay">
        <div class="brand-logo" id="logoContainer">
            <div id="logo-mesh">
                <svg viewBox="0 0 200 200">
                    <g stroke="white" stroke-width="10" fill="none" stroke-linecap="round">
                        <path d="M60,140 L140,60" />
                        <path d="M140,140 L60,60" stroke="#00ff00" />
                        <path d="M80,165 Q100,155 120,165" stroke-width="4" />
                    </g>
                    <text x="72" y="190" fill="white" font-size="11" font-weight="bold" style="letter-spacing: 2px;">BRAND X</text>
                </svg>
            </div>
        </div>

        <nav class="main-menu">
            <div class="item">HOME</div>
            <div class="item">CATALOG</div>
            <div class="item">CONTACT</div>
        </nav>
    </div>

    <div class="social-bar">
        <a href="https://www.instagram.com/xce____7oda__x?igsh=cmI5aXd4OHp1cDhl" target="_blank" class="social-link">
            <svg viewBox="0 0 24 24"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.069-4.85.069-3.204 0-3.584-.012-4.849-.069-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/></svg>

        </a>
    </div>

    <script>
        const canvas = document.getElementById('starfield');
        const ctx = canvas.getContext('2d');
        let stars = [];
        const starCount = 400; // عدد النجوم
        const speed = 0.1;    // السرعة الهادئة (كانت 6 سابقاً)

        function init() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            stars = [];
            for(let i=0; i<starCount; i++) {
                stars.push({
                    x: Math.random() * canvas.width - canvas.width/2,
                    y: Math.random() * canvas.height - canvas.height/2,
                    z: Math.random() * canvas.width,
                    o: Math.random()
                });
            }
        }

        function draw() {
            ctx.fillStyle = "black";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            for(let i=0; i<starCount; i++) {
                let s = stars[i];
                s.z -= speed; 
                if (s.z <= 0) s.z = canvas.width;

                let x = (s.x / s.z) * canvas.width + canvas.width/2;
                let y = (s.y / s.z) * canvas.height + canvas.height/2;
                let radius = (1 - s.z/canvas.width) * 3;

                ctx.beginPath();
                ctx.fillStyle = `rgba(255, 255, 255, ${s.o})`;
                ctx.arc(x, y, radius, 0, Math.PI*2);
                ctx.fill();
            }
            requestAnimationFrame(draw);
        }

        window.addEventListener('resize', init);
        init();
        draw();

        // حركة اللوجو
        const container = document.getElementById('logoContainer');
        const mesh = document.getElementById('logo-mesh');
        let isDown = false;
        let startX, startY;

        const start = (e) => {
            isDown = true;
            startX = (e.pageX || e.touches[0].pageX);
            startY = (e.pageY || e.touches[0].pageY);
            mesh.style.transition = "none";
        };

        const move = (e) => {
            if(!isDown) return;
            let x = (e.pageX || e.touches[0].pageX);
            let y = (e.pageY || e.touches[0].pageY);
            let rotY = (x - startX) * 0.5;
            let rotX = (startY - y) * 0.5;
            mesh.style.transform = `rotateX(${rotX}deg) rotateY(${rotY}deg)`;
        };

        const end = () => {
            isDown = false;
            mesh.style.transition = "transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275)";
            mesh.style.transform = `rotateX(0deg) rotateY(0deg)`;
        };

        container.addEventListener('mousedown', start);
        window.addEventListener('mousemove', move);
        window.addEventListener('mouseup', end);
        container.addEventListener('touchstart', start);
        window.addEventListener('touchmove', move);
        window.addEventListener('touchend', end);
    </script>
</body>
</html>

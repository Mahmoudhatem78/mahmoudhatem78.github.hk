<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brand X Interface</title>
    <style>
        /* --- 1. إعدادات الصفحة والخطوط --- */
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@800&display=swap');

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: radial-gradient(ellipse at bottom, #1b2735 0%, #090a0f 100%);
            font-family: 'Montserrat', sans-serif; /* خط عريض وعصري */
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between; /* توزيع العناصر (فوق - وسط - تحت) */
        }

        /* --- 2. خلفية النجوم (نفس الكود السابق) --- */
        .stars-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1; /* خلف كل شيء */
        }
        .star { width: 1px; height: 1px; background: transparent; animation: animStar 50s linear infinite; }
        .star2 { width: 2px; height: 2px; background: transparent; animation: animStar 100s linear infinite; }
        .star3 { width: 3px; height: 3px; background: transparent; animation: animStar 150s linear infinite; }
        
        @keyframes animStar { from { transform: translateY(0px); } to { transform: translateY(-2000px); } }

        /* --- 3. حاوية المحتوى الرئيسي --- */
        .main-interface {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            width: 100%;
            z-index: 10;
        }

        /* --- 4. اللوجو (Brand X) --- */
        .logo-wrapper {
            width: 120px;
            height: 120px;
            margin-bottom: 40px; /* مسافة بين اللوجو والقائمة */
            cursor: grab;
            perspective: 1000px;
            touch-action: none;
        }
        .logo-wrapper:active { cursor: grabbing; }

        .brand-x {
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            transition: transform 0.1s ease-out;
            filter: drop-shadow(0 0 10px #00ff00);
        }

        svg {
            width: 100%;
            height: 100%;
            fill: none;
            stroke: #00ff00;
            stroke-width: 12;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* --- 5. القائمة (Menu) --- */
        .menu {
            display: flex;
            flex-direction: column;
            gap: 25px; /* مسافة بين الكلمات */
            text-align: center;
        }

        .menu-item {
            font-size: 1.8rem;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: #e0e0e0; /* لون أبيض مائل للرمادي قليلاً مثل الصورة */
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            user-select: none;
        }

        /* تأثير عند مرور الماوس */
        .menu-item:hover {
            color: #fff;
            transform: scale(1.1);
        }

        /* تأثير التوهج عند الضغط (Active Class) */
        .menu-item.active-glow {
            color: #fff;
            text-shadow: 
                0 0 10px #fff,
                0 0 20px #fff,
                0 0 40px #00ff00, /* توهج خارجي أخضر */
                0 0 80px #00ff00;
        }

        /* --- 6. أيقونات السوشيال ميديا (أسفل الشاشة) --- */
        .socials {
            display: flex;
            gap: 20px;
            margin-bottom: 40px;
            z-index: 10;
        }

        .social-icon {
            width: 24px;
            height: 24px;
            fill: white;
            cursor: pointer;
            opacity: 0.7;
            transition: 0.3s;
        }

        .social-icon:hover {
            opacity: 1;
            transform: translateY(-3px);
            filter: drop-shadow(0 0 5px white);
        }

    </style>
</head>
<body>

    <div id="stars" class="stars-container star"></div>
    <div id="stars2" class="stars-container star2"></div>
    <div id="stars3" class="stars-container star3"></div>

    <div class="main-interface">
        
        <div class="logo-wrapper" id="logoContainer">
            <div class="brand-x" id="brandLogo">
                <svg viewBox="0 0 100 100">
                    <line x1="25" y1="25" x2="75" y2="75" />
                    <line x1="75" y1="25" x2="25" y2="75" />
                </svg>
            </div>
        </div>

        <div class="menu">
            <div class="menu-item" onclick="activateGlow(this)">HOME</div>
            <div class="menu-item" onclick="activateGlow(this)">CATALOG</div>
            <div class="menu-item" onclick="activateGlow(this)">CONTACT</div>
        </div>

    </div>

    <div class="socials">
        <svg class="social-icon" viewBox="0 0 24 24">
            <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.069-4.85.069-3.204 0-3.584-.012-4.849-.069-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/>
        </svg>
        <svg class="social-icon" viewBox="0 0 24 24">
            <path d="M12.525.02c1.31-.02 2.61-.01 3.91-.02.08 1.53.63 3.09 1.75 4.17 1.12 1.11 2.7 1.62 4.24 1.79v4.03c-1.44-.05-2.89-.35-4.2-.97-.57-.26-1.1-.65-1.55-1.09-.01 2.83.03 5.66-.02 8.5-.16 2.61-2.14 4.86-4.73 5.37-2.67.55-5.5-1.09-6.18-3.69-.69-2.58 1.25-5.22 3.93-5.32v4.02c-1.23-.05-2.26 1.18-2.03 2.43.21 1.16 1.47 1.83 2.52 1.46 1.15-.36 1.84-1.58 1.68-2.78-.05-4.46-.02-8.91-.03-13.37-.01-1.63-.01-3.26-.01-4.89-.84.23-1.69.45-2.54.67-.01-.13-.02-.27-.03-.4 1.05-.29 2.1-.58 3.16-.89z"/>
        </svg>
    </div>

    <script>
        // --- 1. توليد النجوم ---
        function generateBoxShadows(n) {
            let value = '${Math.random() * 2000}px ${Math.random() * 2000}px #FFF';
            for (let i = 2; i <= n; i++) {
                value += `, ${Math.random() * 2000}px ${Math.random() * 2000}px #FFF`;
            }
            return value;
        }
        document.getElementById('stars').style.boxShadow = generateBoxShadows(700);
        document.getElementById('stars2').style.boxShadow = generateBoxShadows(200);
        document.getElementById('stars3').style.boxShadow = generateBoxShadows(100);

        // --- 2. وظيفة التوهج عند الضغط ---
        function activateGlow(element) {
            // إزالة التوهج من جميع العناصر الأخرى
            document.querySelectorAll('.menu-item').forEach(item => {
                item.classList.remove('active-glow');
            });
            
            // إضافة التوهج للعنصر المضغوط
            element.classList.add('active-glow');
            
            // اختياري: إذا أردت أن يختفي التوهج بعد فترة، ألغِ التعليق عن السطر التالي
            // setTimeout(() => element.classList.remove('active-glow'), 500);
        }

        // --- 3. حركة اللوجو (Drag & Rotate) ---
        const container = document.getElementById('logoContainer');
        const logo = document.getElementById('brandLogo');

        let isDragging = false;
        let startX, startY;

        function handleStart(clientX, clientY) {
            isDragging = true;
            startX = clientX;
            startY = clientY;
        }

        function handleMove(clientX, clientY) {
            if (!isDragging) return;

            const deltaX = clientX - startX;
            const deltaY = clientY - startY;

            // تدوير بناءً على الحركة
            const rotateY = deltaX * 1.5;
            const rotateX = -deltaY * 1.5;

            logo.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
        }

        function handleEnd() {
            isDragging = false;
            logo.style.transform = `rotateX(0deg) rotateY(0deg)`; // عودة للوضع الأصلي
        }

        // Mouse Events
        container.addEventListener('mousedown', (e) => handleStart(e.clientX, e.clientY));
        window.addEventListener('mousemove', (e) => handleMove(e.clientX, e.clientY));
        window.addEventListener('mouseup', handleEnd);

        // Touch Events
        container.addEventListener('touchstart', (e) => handleStart(e.touches[0].clientX, e.touches[0].clientY), {passive: false});
        window.addEventListener('touchmove', (e) => handleMove(e.touches[0].clientX, e.touches[0].clientY), {passive: false});
        window.addEventListener('touchend', handleEnd);

    </script>
</body>
</html>

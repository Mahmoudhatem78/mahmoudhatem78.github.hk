<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K_Brand Space Interface</title>
    <style>
        /* --- 1. إعدادات الخلفية (فضاء عميق) --- */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050505; /* أسود داكن جداً مثل الصورة */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Arial', sans-serif;
        }

        /* --- 2. نظام النجوم المتحركة المتطور --- */
        .stars-background {
            position: absolute;
            width: 100%;
            height: 100%;
            background: black url('https://s3-us-west-2.amazonaws.com/s.cdpn.io/123163/stars.png') repeat;
            z-index: 0;
            opacity: 0.8;
            animation: move-stars 150s linear infinite;
        }

        @keyframes move-stars {
            from { background-position: 0 0; }
            to { background-position: 0 -10000px; }
        }

        /* إضافة طبقة ضبابية خفيفة لتعميق النجوم */
        .stars-overlay {
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, transparent 0%, rgba(0,0,0,0.8) 100%);
            z-index: 1;
        }

        /* --- 3. حاوية اللوجو (الثبات في المكان مع الدوران) --- */
        .logo-section {
            z-index: 10;
            width: 200px;
            height: 150px;
            perspective: 1000px;
            cursor: grab;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 50px;
            touch-action: none;
        }

        #logo-3d {
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            transition: transform 0.1s ease-out;
            /* توهج اللوجو باللون الأبيض المائل للصفرة كما في الصورة */
            filter: drop-shadow(0 0 8px rgba(255, 255, 220, 0.8));
        }

        /* رسم اللوجو ليحاكي الصورة */
        .logo-svg {
            width: 100%;
            height: 100%;
        }

        /* --- 4. القائمة (نفس تنسيق الصورة) --- */
        .nav-menu {
            z-index: 10;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .nav-item {
            color: #f0f0f0;
            font-size: 1.2rem;
            font-weight: bold;
            letter-spacing: 5px;
            text-decoration: none;
            cursor: pointer;
            transition: 0.3s;
            opacity: 0.8;
            user-select: none;
        }

        .nav-item:hover {
            opacity: 1;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.9);
            transform: scale(1.05);
        }

        /* تأثير التوهج عند الضغط */
        .nav-item:active {
            text-shadow: 0 0 25px #ffffff, 0 0 40px #ffffff;
            color: #ffffff;
        }

        /* --- 5. أيقونات السوشيال ميديا أسفل الشاشة --- */
        .footer-socials {
            position: absolute;
            bottom: 40px;
            z-index: 10;
            display: flex;
            gap: 25px;
            opacity: 0.6;
        }

        .icon {
            width: 22px;
            height: 22px;
            fill: white;
            transition: 0.3s;
        }

        .icon:hover {
            opacity: 1;
            filter: drop-shadow(0 0 5px white);
        }

    </style>
</head>
<body>

    <div class="stars-background"></div>
    <div class="stars-overlay"></div>

    <div class="logo-section" id="logoArea">
        <div id="logo-3d">
            <svg class="logo-svg" viewBox="0 0 200 150">
                <g stroke="white" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M60,110 L140,40" />
                    <path d="M140,40 Q100,20 80,60 L140,110" />
                    <path d="M70,120 Q100,110 130,125" stroke-width="3" />
                </g>
                <text x="90" y="140" fill="white" font-size="10" font-family="cursive" style="letter-spacing: 2px;">BRAND</text>
            </svg>
        </div>
    </div>

    <div class="nav-menu">
        <div class="nav-item">HOME</div>
        <div class="nav-item">CATALOG</div>
        <div class="nav-item">CONTACT</div>
    </div>

    <div class="footer-socials">
        <svg class="icon" viewBox="0 0 24 24"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.069-4.85.069-3.204 0-3.584-.012-4.849-.069-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/></svg>
        <svg class="icon" viewBox="0 0 24 24"><path d="M12.525.02c1.31-.02 2.61-.01 3.91-.02.08 1.53.63 3.09 1.75 4.17 1.12 1.11 2.7 1.62 4.24 1.79v4.03c-1.44-.05-2.89-.35-4.2-.97-.57-.26-1.1-.65-1.55-1.09-.01 2.83.03 5.66-.02 8.5-.16 2.61-2.14 4.86-4.73 5.37-2.67.55-5.5-1.09-6.18-3.69-.69-2.58 1.25-5.22 3.93-5.32v4.02c-1.23-.05-2.26 1.18-2.03 2.43.21 1.16 1.47 1.83 2.52 1.46 1.15-.36 1.84-1.58 1.68-2.78-.05-4.46-.02-8.91-.03-13.37-.01-1.63-.01-3.26-.01-4.89-.84.23-1.69.45-2.54.67-.01-.13-.02-.27-.03-.4 1.05-.29 2.1-.58 3.16-.89z"/></svg>
    </div>

    <script>
        const logoArea = document.getElementById('logoArea');
        const logo3D = document.getElementById('logo-3d');

        let isDragging = false;
        let startX, startY;
        let currentRotationX = 0;
        let currentRotationY = 0;

        // دالة لبدء التفاعل
        const startAction = (clientX, clientY) => {
            isDragging = true;
            startX = clientX;
            startY = clientY;
        };

        // دالة التحريك 360 درجة في مكانه
        const moveAction = (clientX, clientY) => {
            if (!isDragging) return;

            const deltaX = clientX - startX;
            const deltaY = clientY - startY;

            // حساب زوايا الدوران بناءً على حركة الإصبع/الماوس
            const rotateY = currentRotationY + (deltaX * 0.5); 
            const rotateX = currentRotationX - (deltaY * 0.5);

            // تطبيق الدوران (اللوجو يبقى في مكانه ويدور فقط)
            logo3D.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
        };

        const endAction = () => {
            isDragging = false;
            // يمكنك جعل اللوجو يعود لوضعه الأصلي أو يظل في مكانه المدور
            // logo3D.style.transform = `rotateX(0deg) rotateY(0deg)`;
        };

        // أحداث الماوس
        logoArea.addEventListener('mousedown', (e) => startAction(e.clientX, e.clientY));
        window.addEventListener('mousemove', (e) => moveAction(e.clientX, e.clientY));
        window.addEventListener('mouseup', endAction);

        // أحداث اللمس (موبايل)
        logoArea.addEventListener('touchstart', (e) => {
            startAction(e.touches[0].clientX, e.touches[0].clientY);
        }, {passive: false});
        window.addEventListener('touchmove', (e) => {
            moveAction(e.touches[0].clientX, e.touches[0].clientY);
        }, {passive: false});
        window.addEventListener('touchend', endAction);

    </script>
</body>
</html>
